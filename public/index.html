<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PriceGuard AI - Know the price. Know the moment.">
    <meta name="theme-color" content="#F7F5EF">
    <title>PriceGuard — Live Price Intelligence</title>
    <link rel='icon' type='image/svg+xml' href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23101B15'/%3E%3Cpath d='M18.5 8.6c0 4.6-3.1 6.9-6 8.2a.9.9 0 0 1-.7 0c-2.9-1.3-6-3.6-6-8.2V4.9c0-.4.4-.8.8-.8 1.7 0 3.7-1 5-2.2a.9.9 0 0 1 1.2 0c1.4 1.2 3.3 2.2 5 2.2.4 0 .7.4.7.8z' fill='%2335C287'/%3E%3Cpath d='m9.2 11.6 2 2 3.6-3.6' stroke='%23F2F6F2' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('home', '', '', `

            <!-- HERO · signal desk with live radar scope -->
            <div class="hero">
                <div class="hero-inner">
                    <div class="hero-copy">
                        <span class="hero-eyebrow">Price intelligence desk</span>
                        <h1 class="hero-title">Know the Price.<br><span class="grad-text">Know the Moment.</span></h1>
                        <p class="hero-sub">PriceGuard sweeps Amazon, Flipkart and Croma around the clock,
                            verifies every tracked number, and tells you plainly when it is time to buy.</p>

                        <div class="hero-search" id="heroSearchBox">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="text" id="heroSearch" placeholder="Search a product, paste a product URL, or compare prices…" autocomplete="off" aria-label="Search products">
                            <button class="hero-go" id="heroGo"><span>Analyse</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
                        </div>

                        <div class="hero-monitor" id="aiStatus">
                            <span class="hm-live"><i></i>Monitoring prices</span>
                            <span class="hm-stores">Amazon &middot; Flipkart &middot; Croma</span>
                        </div>
                        <div class="chip-row" id="popularChips" style="margin-top:16px;"></div>
                    </div>

                    <div class="hero-scope">
                        <div class="radar">
                            <svg class="radar-svg" viewBox="0 0 400 300" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
                                <defs>
                                    <radialGradient id="scopeGlow" cx="50%" cy="50%" r="50%">
                                        <stop offset="0%" stop-color="#35C287" stop-opacity="0.07"/>
                                        <stop offset="100%" stop-color="#35C287" stop-opacity="0"/>
                                    </radialGradient>
                                </defs>
                                <circle cx="200" cy="160" r="190" fill="url(#scopeGlow)"/>
                                <g stroke="#EBF1EC" stroke-opacity="0.09" fill="none">
                                    <circle cx="200" cy="160" r="46"/>
                                    <circle cx="200" cy="160" r="92"/>
                                    <circle cx="200" cy="160" r="138"/>
                                    <line x1="200" y1="12" x2="200" y2="308"/>
                                    <line x1="52" y1="160" x2="348" y2="160"/>
                                    <line x1="97" y1="57" x2="303" y2="263" stroke-opacity="0.05"/>
                                    <line x1="303" y1="57" x2="97" y2="263" stroke-opacity="0.05"/>
                                </g>
                                <g class="sweep">
                                    <path d="M200 160 L200 22 A138 138 0 0 1 306 68 Z" fill="#35C287" opacity="0.13"/>
                                    <path d="M200 160 L200 22 A138 138 0 0 1 253 34 Z" fill="#35C287" opacity="0.12"/>
                                    <line x1="200" y1="160" x2="200" y2="22" stroke="#35C287" stroke-width="1.4" stroke-opacity="0.85"/>
                                </g>
                                <g>
                                    <circle cx="152" cy="118" r="2.4" fill="#35C287"/><circle class="blip" cx="152" cy="118" r="5" fill="none" stroke="#35C287" style="animation-delay:.2s"/>
                                    <circle cx="252" cy="102" r="2.4" fill="#35C287"/><circle class="blip" cx="252" cy="102" r="5" fill="none" stroke="#35C287" style="animation-delay:1.1s"/>
                                    <circle cx="286" cy="196" r="2.4" fill="#35C287"/><circle class="blip" cx="286" cy="196" r="5" fill="none" stroke="#35C287" style="animation-delay:2s"/>
                                    <circle cx="128" cy="212" r="2.4" fill="#35C287"/><circle class="blip" cx="128" cy="212" r="5" fill="none" stroke="#35C287" style="animation-delay:.7s"/>
                                    <circle cx="222" cy="238" r="2.4" fill="#35C287"/><circle class="blip" cx="222" cy="238" r="5" fill="none" stroke="#35C287" style="animation-delay:1.6s"/>
                                    <circle cx="96" cy="156" r="2.4" fill="#35C287"/><circle class="blip" cx="96" cy="156" r="5" fill="none" stroke="#35C287" style="animation-delay:2.5s"/>
                                </g>
                            </svg>
                            <span class="scope-frame"></span>
                            <span class="scope-tag"><i></i>Live price radar</span>
                        </div>
                        <dl class="scope-readout" id="scopeReadout">
                            <div><dt>Tracked</dt><span class="lead"></span><dd class="plain" id="roTracked">— products</dd></div>
                            <div><dt>Target hits</dt><span class="lead"></span><dd id="roHits">—</dd></div>
                            <div><dt>Top deal score</dt><span class="lead"></span><dd id="roScore">—</dd></div>
                            <div><dt>Stores swept</dt><span class="lead"></span><dd class="plain" id="roStores">Amazon · Flipkart · Croma</dd></div>
                        </dl>
                    </div>
                </div>
            </div>

            <!-- TICKER TAPE · real tracked prices -->
            <div class="tape-wrap" aria-hidden="true"><div class="tape-run" id="priceTape"></div></div>

            <!-- key numbers -->
            <div class="statband home-stats">
                <div class="statband-cell" data-href="products.html"><span class="statband-label">Products tracked</span><div class="statband-num" id="stProducts">—</div><span class="statband-sub">Across all categories · live monitoring</span></div>
                <div class="statband-cell" data-href="products.html"><span class="statband-label">Top deal score</span><div class="statband-num" id="stScore">—</div><span class="statband-sub">Computed just now · from live signals</span></div>
                <div class="statband-cell" data-href="alerts.html"><span class="statband-label">Target hits</span><div class="statband-num" id="stHits">—</div><span class="statband-sub">At or below target · ready to buy</span></div>
                <div class="statband-cell" data-href="alerts.html"><span class="statband-label">Active alerts</span><div class="statband-num" id="stAlerts">—</div><span class="statband-sub">Prices &amp; stock moves worth a look</span></div>
            </div>

            <!-- TODAY'S BEST DEALS -->
            <section class="dash-section">
                <div class="section-head">
                    <div><span class="eyebrow">01 — Today's best</span><h3>Deals worth your attention</h3></div>
                    <a class="see-all" href="products.html">Browse all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
                </div>
                <div class="deals-layout" id="dealsLayout">
                    <div id="oppSlot" style="min-height:340px"><div class="loadphrase" role="status" aria-live="polite" data-phrases="Checking current prices…|Comparing stores…|Verifying price data…"><span class="lp-msg">Checking current prices…</span><div class="lp-bar"><i></i></div></div></div>
                    <div class="deal-support" id="dealSupport"></div>
                </div>
            </section>

            <!-- PRICE INTELLIGENCE SPOTLIGHT & HISTORY -->
            <section class="dash-section">
                <div class="section-head">
                    <div><span class="eyebrow">02 — Price intelligence</span><h3>The moment, decoded</h3></div>
                </div>
                <div class="spotlight" id="spotlight">
                    <div class="spot-left" id="spotLeft"><div class="skel block-skel tall"></div></div>
                    <div class="spot-right" id="spotRight"><div class="chart-panel inner"><div class="skel block-skel tall"></div></div></div>
                </div>
            </section>

            <!-- BUY / WAIT -->
            <section class="dash-section">
                <div class="section-head">
                    <div><span class="eyebrow">03 — Buy / Wait</span><h3>Should you buy it today?</h3></div>
                </div>
                <div class="rail" id="buywaitRail"><div class="loadphrase" role="status" aria-live="polite" data-phrases="Checking historical trends…"><span class="lp-msg">Checking historical trends…</span><div class="lp-bar"><i></i></div></div></div>
            </section>

            <!-- PRICE ALERTS PREVIEW -->
            <section class="dash-section">
                <div class="section-head">
                    <div><span class="eyebrow">04 — Price alerts</span><h3>What changed today</h3></div>
                    <a class="see-all" href="alerts.html">All alerts <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
                </div>
                <div class="alerts-preview" id="alertsPreview"><div class="loadphrase" role="status" aria-live="polite" data-phrases="Preparing your price insight…"><span class="lp-msg">Preparing your price insight…</span><div class="lp-bar"><i></i></div></div></div>
            </section>

            <!-- STORE COMPARISON -->
            <section class="dash-section">
                <div class="section-head">
                    <div><span class="eyebrow">05 — Store comparison</span><h3>Where the deals live</h3></div>
                    <a class="see-all" href="scrapers.html">Deep dive <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
                </div>
                <div class="store-ledger" id="storeCompare"><div class="loadphrase" role="status" aria-live="polite" data-phrases="Comparing stores…"><span class="lp-msg">Comparing stores…</span><div class="lp-bar"><i></i></div></div></div>
            </section>

            <!-- PRICE MONITOR (self-healing) -->
            <section class="dash-section">
                <div class="section-head">
                    <div><span class="eyebrow">06 — Self-healing monitor</span><h3>Every store, watched</h3></div>
                    <a class="see-all" href="scrapers.html">Advanced insights <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
                </div>
                <div class="monitor-strip" id="priceMonitor"><div class="loadphrase" role="status" aria-live="polite" data-phrases="Verifying price data…"><span class="lp-msg">Verifying price data…</span><div class="lp-bar"><i></i></div></div></div>
            </section>

            <!-- ADVANCED · DATA HEALTH -->
            <details class="adv-wrap" id="dataHealth">
                <summary>
                    <span class="eyebrow adv-eyebrow">Advanced</span>
                    <span class="adv-title">Data health</span>
                    <span class="adv-hint">How fresh is the data behind every number?</span>
                    <svg class="adv-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="dh-body" id="dhBody"><div class="skel row-skel"></div></div>
            </details>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/dashboard.js"></script>
</body>
</html>
