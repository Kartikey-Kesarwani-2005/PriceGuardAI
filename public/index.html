<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PriceGuard AI - Price and inventory intelligence">
    <title>PriceGuard AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        const app = document.getElementById('app');
        app.innerHTML = Layout.renderPage('dashboard', 'Good morning, Kartikey', "Here's what's happening with your monitored products.", `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Products Monitored</p><h2 class="stat-value" id="productsMonitored">0</h2></div><div class="stat-icon">□</div></div><div class="stat-bottom"><span class="stat-trend">Active</span><span class="stat-description">Across all stores</span></div></div>
                <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Healthy Scrapers</p><h2 class="stat-value" id="healthyScrapers">0</h2></div><div class="stat-icon">◉</div></div><div class="stat-bottom"><span class="stat-trend">Operational</span><span class="stat-description">All monitors active</span></div></div>
                <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Self-healed</p><h2 class="stat-value" id="selfHealed">0</h2></div><div class="stat-icon">✦</div></div><div class="stat-bottom"><span class="stat-trend">Automatic</span><span class="stat-description">Repairs applied</span></div></div>
                <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Price drops</p><h2 class="stat-value" id="priceDrops">0</h2></div><div class="stat-icon">↓</div></div><div class="stat-bottom"><span class="stat-trend">Detected</span><span class="stat-description">Below target price</span></div></div>
            </div>
            <div class="dashboard-grid">
                <div class="table-card">
                    <div class="table-header"><h3>Monitored products</h3></div>
                    <table class="data-table">
                        <thead><tr><th>Product</th><th>Store</th><th>Price</th><th>Target</th><th>Stock</th><th>Status</th></tr></thead>
                        <tbody id="productTable"></tbody>
                    </table>
                </div>
                <div class="table-card">
                    <div class="table-header"><h3>AI healing activity</h3></div>
                    <div class="activity-feed">
                        <div class="activity-item"><div class="activity-dot"></div><div><strong>Selector updated</strong><span>Smartphones on Amazon · 12 min ago</span></div></div>
                        <div class="activity-item"><div class="activity-dot"></div><div><strong>Selector updated</strong><span>Laptops on Flipkart · 48 min ago</span></div></div>
                        <div class="activity-item"><div class="activity-dot"></div><div><strong>Selector updated</strong><span>Smartwatches on Croma · 2 hrs ago</span></div></div>
                        <div class="activity-item"><div class="activity-dot"></div><div><strong>Selector updated</strong><span>Televisions on Amazon · 3 hrs ago</span></div></div>
                    </div>
                </div>
            </div>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/dashboard.js"></script>
</body>
</html>
