<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - PriceGuard AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('settings', 'Settings', 'Configure monitoring and notification preferences.', `
            <div class="settings-card">
                <div class="setting-row">
                    <div><h3>Demo mode</h3><p>Use sample data for instant loading. Turn off to use live Bright Data scraping.</p></div>
                    <button class="toggle toggle-on" id="toggleDemo" data-setting="demo"><span></span></button>
                </div>
                <div class="setting-row">
                    <div><h3>Continuous monitoring</h3><p>Periodically check monitored products for changes.</p></div>
                    <button class="toggle toggle-on" data-setting="monitoring"><span></span></button>
                </div>
                <div class="setting-row">
                    <div><h3>Price notifications</h3><p>Notify when products reach target prices.</p></div>
                    <button class="toggle toggle-on" data-setting="notifications"><span></span></button>
                </div>
            </div>
            <div class="interval-card">
                <h3>Monitoring interval</h3>
                <p>How frequently should products be checked?</p>
                <select id="interval">
                    <option value="15">Every 15 minutes</option>
                    <option value="30">Every 30 minutes</option>
                    <option value="60">Every 1 hour</option>
                    <option value="360">Every 6 hours</option>
                </select>
            </div>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/settings.js"></script>
</body>
</html>
