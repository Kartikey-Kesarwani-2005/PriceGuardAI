<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#04060c">
    <title>Settings - PriceGuard AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='.55' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='%23070b14'/%3E%3Cpath d='M18.5 8.6c0 4.6-3.1 6.9-6 8.2a.9.9 0 0 1-.7 0c-2.9-1.3-6-3.6-6-8.2V4.9c0-.4.4-.8.8-.8 1.7 0 3.7-1 5-2.2a.9.9 0 0 1 1.2 0c1.4 1.2 3.3 2.2 5 2.2.4 0 .7.4.7.8z' fill='url(%23g)'/%3E%3Cpath d='m9.2 11.6 2 2 3.6-3.6' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('settings', 'Settings', 'Configure monitoring and notification preferences.', `
            <div class="settings-card">
                <div class="setting-row">
                    <div><h3>Demo mode</h3><p>Use sample data for instant loading. Turn off to use live Bright Data scraping.</p></div>
                    <button class="toggle toggle-on" id="toggleDemo" data-setting="demo" role="switch" aria-checked="true" aria-label="Demo mode"><span></span></button>
                </div>
                <div class="setting-row">
                    <div><h3>Continuous monitoring</h3><p>Periodically check monitored products for changes.</p></div>
                    <button class="toggle toggle-on" data-setting="monitoring" role="switch" aria-checked="true" aria-label="Continuous monitoring"><span></span></button>
                </div>
                <div class="setting-row">
                    <div><h3>Price notifications</h3><p>Notify when products reach target prices.</p></div>
                    <button class="toggle toggle-on" data-setting="notifications" role="switch" aria-checked="true" aria-label="Price notifications"><span></span></button>
                </div>
            </div>
            <div class="interval-card">
                <h3>Monitoring interval</h3>
                <p>How frequently should products be checked?</p>
                <select id="interval">
                    <option value="15">Every 15 minutes</option>
                    <option value="30">Every 30 minutes</option>
                    <option value="60">Every 1 hour</option>
                    <option value="360">Every 6 hours</option>
                </select>
            </div>
            <div class="account-card">
                <h3>Account management</h3>
                <p>All accounts registered on this device. Deleting an account requires its PIN.</p>
                <div id="accountList"></div>
            </div>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/settings.js"></script>
</body>
</html>
