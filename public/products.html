<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#04060c">
    <title>Products - PriceGuard AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='.55' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='%23070b14'/%3E%3Cpath d='M18.5 8.6c0 4.6-3.1 6.9-6 8.2a.9.9 0 0 1-.7 0c-2.9-1.3-6-3.6-6-8.2V4.9c0-.4.4-.8.8-.8 1.7 0 3.7-1 5-2.2a.9.9 0 0 1 1.2 0c1.4 1.2 3.3 2.2 5 2.2.4 0 .7.4.7.8z' fill='url(%23g)'/%3E%3Cpath d='m9.2 11.6 2 2 3.6-3.6' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('products', 'Products', 'Browse and compare products across categories.', `
            <div class="page-top">
                <button class="primary-button" id="showProductForm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add product</button>
                <button class="primary-button" id="compareBtn" disabled>Compare Selected</button>
                <span class="muted" id="compareHint" style="font-size:11px;margin-left:8px;">Select 2+ products from same category</span>
            </div>
            <div class="form-card hidden" id="productForm">
                <h3>Add new product</h3>
                <div class="form-grid">
                    <div class="form-group full"><label for="productUrl">Product URL</label><input type="url" id="productUrl" placeholder="https://..."></div>
                    <div class="form-group"><label for="productName">Product name</label><input type="text" id="productName" placeholder="e.g. Apple iPhone 15"></div>
                    <div class="form-group"><label for="targetPrice">Target price (₹)</label><input type="number" id="targetPrice" placeholder="e.g. 55000"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" id="cancelProduct">Cancel</button>
                    <button class="btn btn-primary" id="startMonitoring">Start monitoring</button>
                </div>
            </div>
            <div class="category-tabs" id="categoryTabs"></div>
            <div class="search-card"><input type="text" id="productSearch" placeholder="Search products..." autocomplete="off"></div>
            <div class="table-card">
                <table class="data-table">
                    <thead><tr><th></th><th>Product</th><th>Store</th><th>Price</th><th>Target</th><th>Stock</th><th>Status</th></tr></thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>
            <div class="compare-modal hidden" id="compareModal">
                <div class="compare-overlay" id="compareOverlay"></div>
                <div class="compare-panel">
                    <div class="compare-header">
                        <h2 id="compareTitle">Product Comparison</h2>
                        <button class="compare-close" id="closeCompare">&times;</button>
                    </div>
                    <div class="compare-body" id="compareBody"></div>
                </div>
            </div>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/products.js"></script>
</body>
</html>
