<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - PriceGuard AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('products', 'Products', 'Manage your monitored products.', `
            <div class="page-top">
                <button class="btn btn-primary" id="showProductForm">+ Add product</button>
            </div>
            <div class="form-card hidden" id="productForm">
                <h3>Add new product</h3>
                <div class="form-grid">
                    <div class="form-group"><label for="productUrl">Product URL</label><input type="url" id="productUrl" placeholder="https://..."></div>
                    <div class="form-group"><label for="productName">Product name</label><input type="text" id="productName" placeholder="e.g. Apple iPhone 15"></div>
                    <div class="form-group"><label for="targetPrice">Target price (₹)</label><input type="number" id="targetPrice" placeholder="e.g. 55000"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" id="cancelProduct">Cancel</button>
                    <button class="btn btn-primary" id="startMonitoring">Start monitoring</button>
                </div>
            </div>
            <div class="search-card"><input type="text" id="productSearch" placeholder="Search products..."></div>
            <div class="table-card">
                <table class="data-table">
                    <thead><tr><th>Product</th><th>Store</th><th>Price</th><th>Target</th><th>Stock</th><th>Status</th></tr></thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/products.js"></script>
</body>
</html>
