<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#04060c">
    <title>Product Details - PriceGuard AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='.55' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='%23070b14'/%3E%3Cpath d='M18.5 8.6c0 4.6-3.1 6.9-6 8.2a.9.9 0 0 1-.7 0c-2.9-1.3-6-3.6-6-8.2V4.9c0-.4.4-.8.8-.8 1.7 0 3.7-1 5-2.2a.9.9 0 0 1 1.2 0c1.4 1.2 3.3 2.2 5 2.2.4 0 .7.4.7.8z' fill='url(%23g)'/%3E%3Cpath d='m9.2 11.6 2 2 3.6-3.6' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('products', 'Product Details', 'Track price movement, spot trends and time your purchase.', `
            <div class="page-top">
                <a class="btn btn-secondary" href="products.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to products
                </a>
            </div>

            <div class="detail-card" id="pdLoading"><div class="loading">Loading product...</div></div>

            <div class="caught-up hidden" id="pdError">
                <h3>Product not found</h3>
                <p>This product may have been removed or the link is invalid.</p>
            </div>

            <div id="pdContent" class="hidden">
                <div class="detail-head">
                    <div class="detail-id">
                        <span class="detail-cat" id="pdCategory"></span>
                        <h2 id="pdName"></h2>
                        <p class="detail-meta" id="pdMeta"></p>
                    </div>
                    <div class="detail-price">
                        <small>Current price</small>
                        <strong id="pdCurrent">—</strong>
                        <span class="detail-trend" id="pdTrend"></span>
                    </div>
                </div>

                <div class="stats-grid cols-3">
                    <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Current price</p><h2 class="stat-value" id="statCurrent">—</h2></div><div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div><div class="stat-bottom"><span class="stat-trend">Live tracked</span><span class="stat-description" id="statCurrentDesc">Latest price from store</span></div></div>
                    <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Lowest price</p><h2 class="stat-value" id="statLowest">—</h2></div><div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg></div></div><div class="stat-bottom"><span class="stat-trend" id="statLowestTrend">Best deal</span><span class="stat-description" id="statLowestDesc">In selected range</span></div></div>
                    <div class="stat-card"><div class="stat-top"><div><p class="stat-title">Average price</p><h2 class="stat-value" id="statAverage">—</h2></div><div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-6"/></svg></div></div><div class="stat-bottom"><span class="stat-trend" id="statAvgTrend">Typical</span><span class="stat-description" id="statAvgDesc">In selected range</span></div></div>
                </div>

                <div class="intel-panel" id="intelPanel">
                    <div class="skel row-skel"></div>
                    <div class="skel row-skel"></div>
                </div>

                <div class="alert-card" id="alertCard"></div>

                <div class="chart-card chart-panel">
                    <div class="chart-head">
                        <div>
                            <h3 class="chart-title">Price history</h3>
                            <p class="chart-sub" id="chartSub">Loading range...</p>
                        </div>
                        <div class="category-tabs" id="rangeTabs">
                            <button class="cat-tab" data-range="7d">7D</button>
                            <button class="cat-tab active" data-range="30d">30D</button>
                            <button class="cat-tab" data-range="90d">90D</button>
                            <button class="cat-tab" data-range="1y">1Y</button>
                        </div>
                    </div>
                    <div class="chart-wrap" id="chartWrap">
                        <div class="loading">Building chart...</div>
                    </div>
                    <div class="chart-legend">
                        <span><i class="lg-swatch lg-line"></i>Daily price</span>
                        <span><i class="lg-swatch lg-avg"></i>Average</span>
                        <span><i class="lg-swatch lg-target"></i>Your target</span>
                    </div>
                </div>

                <div class="specs-row">
                    <div class="health-card spec-card">
                        <h3>Specifications</h3>
                        <dl class="spec-list" id="pdSpecs"></dl>
                    </div>
                    <div class="health-card spec-card">
                        <h3>Deal snapshot</h3>
                        <dl class="spec-list" id="pdFacts"></dl>
                    </div>
                </div>
            </div>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/product-details.js"></script>
</body>
</html>
