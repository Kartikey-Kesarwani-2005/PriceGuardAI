<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F4EF">
    <title>Insights - PriceGuard AI</title>
    <link rel='icon' type='image/svg+xml' href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2314211B'/%3E%3Cpath d='M18.5 8.6c0 4.6-3.1 6.9-6 8.2a.9.9 0 0 1-.7 0c-2.9-1.3-6-3.6-6-8.2V4.9c0-.4.4-.8.8-.8 1.7 0 3.7-1 5-2.2a.9.9 0 0 1 1.2 0c1.4 1.2 3.3 2.2 5 2.2.4 0 .7.4.7.8z' fill='%233FA37E'/%3E%3Cpath d='m9.2 11.6 2 2 3.6-3.6' stroke='%23EFF4F0' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app"></div>

    <script src="js/components/layout.js"></script>
    <script>
        document.getElementById('app').innerHTML = Layout.renderPage('insights', 'Insights', 'What the market is doing — and how trustworthy your data is.', `
            <div class="section-head">
                <div><span class="eyebrow">Price intelligence</span><h3>Market pulse</h3></div>
            </div>
            <div class="dh-body always-open" id="piStats">
                <div class="skel row-skel"></div>
            </div>

            <div class="section-head">
                <div><span class="eyebrow">Best deals now</span><h3>Highest deal scores across tracked prices</h3></div>
            </div>
            <div class="cards-grid" id="piDeals">
                <div class="skel block-skel"></div><div class="skel block-skel"></div><div class="skel block-skel"></div>
            </div>

            <div class="section-head">
                <div><span class="eyebrow">Trend tracker</span><h3>Every tracked price, explained</h3></div>
            </div>
            <div class="chart-panel inner" id="piFeature">
                <div class="skel block-skel"></div>
            </div>
            <div class="table-card">
                <div class="table-header"><h3>Price intelligence by product</h3></div>
                <div class="pi-list" id="piList">
                    <div class="skel row-skel"></div><div class="skel row-skel"></div><div class="skel row-skel"></div>
                </div>
            </div>

            <div class="section-head">
                <div><span class="eyebrow">Store comparison</span><h3>Reliability by store</h3></div>
            </div>
            <div class="store-grid" id="storeHealth">
                <div class="skel block-skel"></div><div class="skel block-skel"></div><div class="skel block-skel"></div>
            </div>

            <div class="section-head">
                <div><span class="eyebrow">Data health</span><h3>How fresh is your data?</h3></div>
            </div>
            <div class="dh-body always-open" id="dhSummary">
                <div class="skel row-skel"></div>
            </div>

            <details class="adv-wrap">
                <summary>
                    <span class="eyebrow adv-eyebrow">Advanced</span>
                    <span class="adv-title">Scraper monitors</span>
                    <span class="adv-hint">Technical status for every tracked source</span>
                    <svg class="adv-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="health-grid">
                    <div class="health-card"><div class="health-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></div><div><h3>Healthy</h3><p class="health-count" id="healthyCount">0</p></div></div>
                    <div class="health-card"><div class="health-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div><div><h3>Total Products</h3><p class="health-count" id="totalCount">0</p></div></div>
                    <div class="health-card"><div class="health-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div><div><h3>Needs attention</h3><p class="health-count" id="attentionCount">0</p></div></div>
                </div>
                <div class="category-tabs" id="scraperCategoryTabs"></div>
                <div class="table-card">
                    <div class="table-header"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Active scraper monitors</h3></div>
                    <div class="heal-pipe" aria-label="Self-healing scraper loop">
                        <span class="hp-step">Run</span><span class="hp-arrow">→</span>
                        <span class="hp-step">Validate</span><span class="hp-arrow">→</span>
                        <span class="hp-step">Retry</span><span class="hp-arrow">→</span>
                        <span class="hp-step">Heal</span><span class="hp-arrow">→</span>
                        <span class="hp-step">Re-run</span><span class="hp-arrow">→</span>
                        <span class="hp-step">Verified</span>
                    </div>
                    <p style="margin:0 20px 16px;font-size:12px;color:var(--mut);max-width:70ch;">When a tracked source breaks, PriceGuard re-runs it, asks Scraper Studio to rewrite the broken selectors, then verifies the repaired data before it reaches you.</p>
                    <div class="scraper-list" id="scraperList"></div>
                </div>
            </details>
        `);
    </script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/scrapers.js"></script>
</body>
</html>
